services:
  server:
    build:
      context: ./server
    init: true
    env_file:
      - ./server/.env
    environment:
      PORT: "5001"
      CLIENT_URL: http://localhost:5173
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command:
      - ./node_modules/.bin/nodemon
      - --legacy-watch
      - server.js
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  client:
    build:
      context: ./client
    init: true
    environment:
      VITE_API_URL: http://localhost:5001/api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  client_node_modules:
  server_node_modules:
